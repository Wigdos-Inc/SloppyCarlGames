<title>Gloorbio's Poopy Land</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Layout: one 16:9 handheld screen centred in a dark bezel; touch pad below (portrait) or over it (landscape). */
  :root {
    --void: #120a1c;
    --bezel: #2b2433;
    --bezel-edge: #463c52;
    --gold: #f5c518;
    --ink: #f7e8c2;
    --btn: #5c2d91;
    --btn-edge: #2a1245;
    --pixel: 'Press Start 2P', 'Courier New', monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; }
  body { font-family: var(--pixel); -webkit-user-select: none; user-select: none; touch-action: none; }
  #app {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  #stage {
    position: relative; box-sizing: border-box;
    width: min(100%, calc((100vh - 64px) * 16 / 9));
    width: min(100%, calc((100dvh - 64px) * 16 / 9));
    max-width: 100%;
    padding: 10px; border-radius: 22px;
    background: var(--bezel); box-shadow: inset 0 0 0 2px var(--bezel-edge), 0 18px 50px rgba(0,0,0,.6);
  }
  canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 16 / 9;
    border-radius: 12px; outline: 3px solid var(--gold); outline-offset: -1px;
    image-rendering: pixelated; image-rendering: crisp-edges; background: #2a1b4e;
  }
  #touch { display: none; width: 100%; max-width: 760px; justify-content: space-between; align-items: flex-end; gap: 12px; }
  #touch .pad, #touch .acts { display: grid; gap: 8px; }
  #touch .pad { grid-template-columns: repeat(3, 56px); grid-template-rows: 56px 56px; }
  #touch .acts { grid-template-columns: repeat(3, 64px); grid-template-rows: 52px 52px; }
  #touch button {
    font: 9px var(--pixel); color: var(--ink); border: 2px solid var(--gold); border-radius: 14px;
    background: var(--btn); box-shadow: 0 4px 0 var(--btn-edge); padding: 0; touch-action: none;
  }
  #touch button.on { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-edge); }
  #touch [data-k="left"]  { grid-column: 1; grid-row: 2; }
  #touch [data-k="down"]  { grid-column: 2; grid-row: 2; }
  #touch [data-k="right"] { grid-column: 3; grid-row: 2; }
  #touch [data-k="pause"] { grid-column: 2; grid-row: 1; font-size: 8px; opacity: .8; }
  #touch [data-k="jump"]  { grid-column: 3; grid-row: 1 / span 2; border-radius: 50%; font-size: 11px; }
  @media (pointer: coarse) {
    #touch { display: flex; }
    #stage { width: min(100%, calc((100dvh - 230px) * 16 / 9)); }
  }
  @media (pointer: coarse) and (orientation: landscape) {
    #stage { width: min(100%, calc((100dvh - 24px) * 16 / 9)); }
    #touch { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-width: none; padding: 0 calc(env(safe-area-inset-left, 0px) + 12px); box-sizing: border-box; pointer-events: none; }
    #touch .pad, #touch .acts { pointer-events: auto; opacity: .72; }
  }
</style>

<div id="app">
  <div id="stage"><canvas id="game" width="960" height="540" aria-label="Gloorbio's Poopy Land game screen"></canvas></div>
  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button data-k="pause">PAUSE</button>
      <button data-k="left">LEFT</button><button data-k="down">DOWN</button><button data-k="right">RIGHT</button>
    </div>
    <div class="acts">
      <button data-k="waft">WAFT</button><button data-k="chomp">CHOMP</button>
      <button data-k="plunger">PLUNGE</button><button data-k="bash">BASH</button>
      <button data-k="jump">JUMP</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// ======================================================================
//  Setup
// ======================================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const S = 2, W = 480, H = 270, TS = 16;          // world is 480x270, drawn 2x
const FONT = '"Press Start 2P", "Courier New", monospace';

const C = {
  out:'#1b1026',
  skin:'#f3b07c', skinD:'#cf8456',
  hat:'#5c2d91', hatD:'#3d1b66', hatL:'#8a50c8',
  feather:'#c76fd9', featherD:'#8e3ca8',
  gold:'#ffcf33', goldD:'#c98a10', goldL:'#fff09a',
  shirt:'#4f9e3f', shirtD:'#357a2c', shirtL:'#7acb5c', button:'#2c1e4a',
  glove:'#7438b0', gloveD:'#4f2380', gloveL:'#a46ae0',
  pants:'#86613a', pantsD:'#5f4325',
  shoe:'#4a2c18', shoeL:'#76502e',
  nose:'#ef4f74', noseL:'#ffa6bb', noseD:'#b02a50',
  stache:'#231a4a', stacheL:'#41368a',
  lens:'#a8d0ff', frame:'#2a2458', pupil:'#120c24',
  mouth:'#6e1430', tongue:'#e0607e', teeth:'#ffffff', teethD:'#c9c6dc',
  wood:'#9c6b3b', woodD:'#6e4520', woodL:'#c99256',
  cup:'#c2362f', cupL:'#ec6d62', cupD:'#7e1e1a',
  poo:'#7a4a22', pooD:'#55321a', pooL:'#a86d36', pooDD:'#2e1a0c',
  spl:'#5f4a1c', splD:'#3f3110', splL:'#8a7232',
  mud:'#8a5428', mudL:'#b57a3e', mudD:'#6a3d1a', mudO:'#2b1608',
  metal:'#9aa0a6', metalL:'#d6dade', metalD:'#5f646b',
  porc:'#eef0f4', porcD:'#bfc0d4', porcL:'#ffffff',
  stink:'#a8d64c', gas:'#9bd24a', gasL:'#d2f08c',
  wing:'#f3f3f6', wingD:'#b8bfcc',
  rat:'#8a8a96', ratD:'#5e5e6a', ratL:'#b4b4c0', pink:'#e48aa0', red:'#ff3a4a',
  hud:'#5e2c94', hudD:'#3a175f', hudText:'#ffe7a3', heart:'#ff4f6d',
};

// ---------- deterministic helpers ----------
function hash(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
let seed = 1;
const srand = s => { seed = s; };
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
}

// ======================================================================
//  Input
// ======================================================================
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'jump', KeyW:'jump', Space:'jump', ArrowDown:'down', KeyS:'down',
  KeyX:'bash', ShiftLeft:'bash', ShiftRight:'bash', KeyZ:'plunger', KeyJ:'plunger',
  KeyC:'chomp', KeyK:'chomp', KeyV:'waft', KeyL:'waft',
  Enter:'start', KeyP:'pause', Escape:'pause', KeyM:'mute',
};
function press(a) { if (!keys[a]) pressed[a] = true; keys[a] = true; initAudio(); }
function release(a) { keys[a] = false; }
addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault(); if (!e.repeat) press(a);
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) { e.preventDefault(); release(a); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cv.addEventListener('pointerdown', () => { initAudio(); if (game.state !== 'play') pressed.start = true; });
for (const b of document.querySelectorAll('#touch button')) {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.classList.add('on'); press(k); if (k === 'jump' || k === 'pause') pressed.start = true; };
  const off = e => { e.preventDefault(); b.classList.remove('on'); release(k); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
}

// ======================================================================
//  Audio (all synthesized)
// ======================================================================
let actx = null, master, sfxBus, musicBus, noiseBuf, muted = store('gloorbio-muted') === '1';
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.connect(master);
    musicBus = actx.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
}
function tone(f, dur, type = 'square', vol = 0.15, f2 = 0, delay = 0, dest) {
  if (!actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(dest || sfxBus); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, freq = 1000, vol = 0.25, delay = 0, type = 'lowpass', dest) {
  if (!actx) return;
  const t = actx.currentTime + delay, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || sfxBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
}
function wobble(base, end, dur, rate, depth, vol, cutoff) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), lfo = actx.createOscillator(), lg = actx.createGain();
  const f = actx.createBiquadFilter(), g = actx.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(base, t); o.frequency.linearRampToValueAtTime(end, t + dur);
  lfo.frequency.value = rate; lg.gain.value = depth; lfo.connect(lg); lg.connect(o.frequency);
  f.type = 'lowpass'; f.frequency.value = cutoff; f.Q.value = 5;
  g.gain.setValueAtTime(0.0008, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
  g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(f); f.connect(g); g.connect(sfxBus);
  o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
}
const sfx = {
  jump()   { tone(240, 0.14, 'square', 0.1, 560); },
  bigjump(){ tone(180, 0.3, 'square', 0.12, 900); },
  boing()  { tone(180, 0.3, 'sine', 0.3, 900); tone(360, 0.2, 'square', 0.06, 1400); },
  coin()   { tone(988, 0.06, 'square', 0.08); tone(1319, 0.16, 'square', 0.08, 0, 0.06); },
  stomp()  { tone(320, 0.12, 'square', 0.14, 90); noise(0.08, 900, 0.18); },
  bash()   { noise(0.22, 700, 0.25); tone(140, 0.18, 'sawtooth', 0.1, 70); },
  bonk()   { tone(160, 0.16, 'square', 0.18, 60); noise(0.06, 2400, 0.15); },
  clang()  { tone(1200, 0.2, 'square', 0.08, 900); tone(1800, 0.25, 'triangle', 0.1, 1500); },
  pound()  { tone(110, 0.4, 'sine', 0.55, 30); noise(0.35, 380, 0.45); },
  brick()  { noise(0.22, 1500, 0.3); tone(90, 0.1, 'square', 0.1, 50); },
  block()  { tone(520, 0.07, 'square', 0.1); tone(780, 0.07, 'square', 0.08, 0, 0.05); },
  swish()  { noise(0.12, 2600, 0.12, 0, 'bandpass'); },
  shlorp() { tone(520, 0.14, 'sine', 0.3, 110); noise(0.08, 800, 0.15); },
  chomp()  { noise(0.05, 1800, 0.3); tone(170, 0.08, 'square', 0.14, 80); },
  burp()   { wobble(120, 70, 0.45, 18, 25, 0.35, 700); },
  fart()   { wobble(95 + Math.random() * 25, 55, 0.55, 18 + Math.random() * 22, 35, 0.45, 520); noise(0.45, 260, 0.2); },
  roar()   { wobble(70, 40, 1.1, 9, 20, 0.6, 400); noise(1.0, 300, 0.35); },
  pfft()   { noise(0.12, 500, 0.12); },
  plop()   { tone(300, 0.1, 'sine', 0.25, 120); },
  hiss()   { noise(0.6, 4000, 0.06, 0, 'highpass'); },
  thunder(){ noise(1.4, 160, 0.5); },
  hurt()   { tone(440, 0.28, 'sawtooth', 0.12, 110); },
  splat()  { noise(0.15, 600, 0.2); tone(200, 0.1, 'sine', 0.15, 80); },
  key()    { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.12, 'square', 0.09, 0, i * 0.08)); },
  power()  { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, 'triangle', 0.15, 0, i * 0.06)); },
  check()  { [392, 523, 659].forEach((f, i) => tone(f, 0.14, 'square', 0.08, 0, i * 0.09)); },
  locked() { tone(130, 0.12, 'square', 0.12); tone(110, 0.18, 'square', 0.12, 0, 0.12); },
  die()    { [494, 466, 440, 415, 392, 330, 262].forEach((f, i) => tone(f, 0.16, 'square', 0.1, 0, i * 0.11)); },
  clear()  { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i === 6 ? 0.6 : 0.14, 'square', 0.1, 0, i * 0.12)); },
  fanfare(){ [523, 523, 523, 659, 784, 659, 784, 1047, 1047, 1319, 1568].forEach((f, i) => tone(f, i > 8 ? 0.5 : 0.14, 'square', 0.1, 0, i * 0.14)); },
};

// ---------- music ----------
function midi(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  return 12 * (+m[3] + 1) + { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
const seq = s => s.split(/\s+/).filter(x => x && x !== '|').map(x => x === '-' ? 0 : hz(midi(x)));
const SONGS = {
  march: { step: 0.18, wave: 'square',
    lead: seq(`G4 - C5 - D5 Eb5 D5 C5 | Eb5 - C5 - Ab4 - C5 - | F5 - Eb5 D5 C5 - Ab4 - | G4 - B4 - D5 - G5 -
               G4 G4 C5 - Eb5 - G5 F5 | Eb5 - D5 - C5 - Ab4 - | F4 Ab4 C5 F5 Eb5 D5 C5 B4 | C5 - G4 - C5 - - -`),
    bass: seq(`C3 G2 C3 G2 | Ab2 Eb2 Ab2 Eb2 | F2 C3 F2 C3 | G2 D3 G2 B2 | C3 G2 C3 G2 | Ab2 Eb2 Ab2 Eb2 | F2 C3 F2 G2 | C3 G2 C3 -`) },
  spooky: { step: 0.2, wave: 'triangle',
    lead: seq(`D5 - - A4 - - F5 - | E5 - D5 - C#5 - A4 - | D5 - - A4 - - G5 - | F5 E5 D5 - - - - -
               Bb4 - - F5 - - D5 - | C5 - A4 - G4 - F4 - | E4 - G4 - A4 - C#5 - | D5 - - - D4 - - -`),
    bass: seq(`D3 A2 D3 A2 | A2 E2 A2 C#3 | D3 A2 D3 A2 | D3 F2 D3 A2 | Bb2 F2 Bb2 F2 | F2 C3 F2 C3 | A2 E2 A2 C#3 | D3 A2 D2 -`) },
  boss: { step: 0.14, wave: 'square',
    lead: seq(`E5 E5 - E5 G5 - E5 - | D5 D5 - D5 F#5 - D5 - | C5 C5 - C5 E5 - C5 - | B4 - D#5 - F#5 - B5 -
               E5 - B4 - G5 - E5 - | F#5 - D5 - A5 - F#5 - | G5 F#5 E5 D5 C5 B4 A4 G4 | F#4 - B4 - D#5 - B4 -`),
    bass: seq(`E2 E3 E2 E3 | D2 D3 D2 D3 | C2 C3 C2 C3 | B1 B2 B1 B2 | E2 E3 E2 E3 | D2 D3 D2 D3 | C2 C3 A1 A2 | B1 B2 B1 B2`) },
};
let musicOn = false, nextNote = 0, mStep = 0, song = SONGS.march, songTr = 1, songStep = 0.18;
function musicTick() {
  if (!actx || !musicOn) return;
  const now = actx.currentTime;
  if (nextNote < now - 0.1) nextNote = now + 0.05;
  while (nextNote < now + 0.15) {
    const dt = nextNote - now;
    const l = song.lead[mStep];
    if (l) tone(l * songTr, songStep * 0.9, song.wave, 0.07, 0, dt, musicBus);
    if (mStep % 2 === 0) { const b = song.bass[(mStep >> 1) % song.bass.length]; if (b) tone(b * songTr, songStep * 1.7, 'triangle', 0.22, 0, dt, musicBus); }
    else noise(0.03, 7000, 0.05, dt, 'highpass', musicBus);
    if (mStep % 4 === 0) noise(0.08, 200, 0.18, dt, 'lowpass', musicBus);
    nextNote += songStep; mStep = (mStep + 1) % song.lead.length;
  }
}
function startMusic(name = 'march', tr = 0, fast = false) {
  song = SONGS[name]; songTr = Math.pow(2, tr / 12); songStep = song.step * (fast ? 0.86 : 1);
  musicOn = true; mStep = 0; if (actx) nextNote = actx.currentTime + 0.05;
}
function toggleMute() {
  muted = !muted; store('gloorbio-muted', muted ? '1' : '0');
  if (master) master.gain.value = muted ? 0 : 0.55;
}

// ======================================================================
//  Pixel sprite renderer: shapes in groups, each group outlined as one silhouette
// ======================================================================
let groups = null, spriteFlash = null;
function beginSprite() { groups = [[]]; }
function layer() { groups.push([]); }
function Sx(x, y, w, h, c) { groups[groups.length - 1].push([Math.round(x), Math.round(y), w, h, c, 1]); }
function Dx(x, y, w, h, c) { groups[groups.length - 1].push([Math.round(x), Math.round(y), w, h, c, 0]); }
function endSprite(outline = C.out) {
  for (const g of groups) {
    ctx.fillStyle = outline;
    for (const p of g) if (p[5]) ctx.fillRect(p[0] - 1, p[1] - 1, p[2] + 2, p[3] + 2);
    for (const p of g) { ctx.fillStyle = spriteFlash || p[4]; ctx.fillRect(p[0], p[1], p[2], p[3]); }
  }
  groups = null;
}
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

// ---------- Gloorbio ----------
function gLeg(bx, f, B, col) {
  const hipY = -9 + B, fx = bx + f.x, fy = f.y;
  const legX = bx + Math.round(f.x * 0.5), bottom = fy - 2;
  if (bottom > hipY) Sx(legX - 2, hipY, 4, bottom - hipY, col);
  Sx(fx - 3, fy - 3, 7, 3, C.shoe); Dx(fx - 2, fy - 3, 4, 1, C.shoeL);
}
function gArm(sx, sy, f, back) {
  const col = back ? C.shirtD : C.shirt;
  for (let i = 0; i < 3; i++) { const k = i / 3; Sx(sx + (f.x - sx) * k - 2, sy + (f.y - sy) * k - 2, 4, 4, col); }
  Sx(f.x - 3, f.y - 3, 6, 6, back ? C.gloveD : C.glove);
  if (!back) { Dx(f.x - 2, f.y - 3, 3, 1, C.gloveL); Dx(f.x - 1, f.y - 1, 2, 2, C.gold); }
}
function gPlunger(f, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  for (let i = 2; i <= 15; i += 2) Sx(f.x + c * i - 1, f.y + s * i - 1, 2, 2, C.wood);
  const cx = f.x + c * 18, cy = f.y + s * 18;
  Sx(cx - 4, cy - 3, 8, 7, C.cup); Dx(cx - 3, cy - 2, 2, 2, C.cupL); Dx(cx - 4, cy + 3, 8, 1, C.cupD);
}
function gHead(hx, y, P, t) {
  const mouth = P.mouth || 'grin', eyes = P.eyes || 'n', open = mouth === 'open';
  const fw = Math.round(Math.sin(t * 0.08));
  Sx(-9 + hx, -40 + y, 4, 2, C.feather); Sx(-12 + hx, -42 + y + fw, 4, 2, C.feather); Sx(-14 + hx, -45 + y + fw, 3, 3, C.feather);
  Dx(-12 + hx, -42 + y + fw, 3, 1, C.featherD);
  Sx(-9 + hx, -28 + y, 3, 4, C.skin); Sx(-10 + hx, -30 + y, 2, 3, C.skin);
  Sx(-6 + hx, -32 + y, 14, 13, C.skin);
  Sx(-4 + hx, -19 + y, 12, open ? 5 : 1, C.skin);
  Dx(-8 + hx, -27 + y, 1, 2, C.skinD); Dx(-6 + hx, -25 + y, 2, 4, C.skinD);
  Sx(-6 + hx, -40 + y, 12, 8, C.hat); Sx(-4 + hx, -41 + y, 8, 1, C.hat);

function buildLevel(i) {
  ents = []; props = []; startPos = { x: 4 * TS, y: 13 * TS };
  const set = (x, y, c) => { if (x >= 0 && x < COLS && y >= 0 && y < ROWS) map[y][x] = c; };
  const fill = (x0, x1, y0, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, c); };
  const A = {
    size(c, r) { COLS = c; ROWS = r; LW = c * TS; LH = r * TS; map = []; for (let y = 0; y < r; y++) map.push(new Array(c).fill('.')); },
    set, fill,
    ground: (x0, x1, top) => fill(x0, x1, top, ROWS - 1, '#'),
    pit: (x0, x1, top = 0) => { fill(x0, x1, top, ROWS - 1, '.'); fill(x0, x1, ROWS - 2, ROWS - 1, '~'); },
    gap: (x0, x1) => fill(x0, x1, 0, ROWS - 1, '.'),
    plank: (x0, x1, y) => fill(x0, x1, y, y, '='),
    coin: (x, y) => ents.push({ k: 'coin', x: x * TS + 8, y: y * TS + 8 }),
    coins(x0, x1, y) { for (let x = x0; x <= x1; x++) A.coin(x, y); },
    foe: (type, x, row) => ents.push({ k: 'foe', type, tx: x, row }),
    item: (k, x, row) => ents.push({ k, x: x * TS + 8, y: (row + 1) * TS }),
    post: (x, y0, y1) => props.push({ k: 'post', x: x * TS + 6, y0: y0 * TS, y1: (y1 + 1) * TS }),
    sign: (x, text, top = 13) => props.push({ k: 'sign', x: x * TS + 8, y: top * TS, text }),
    pipe: (x, top, bottom) => { set(x, top, 'T'); fill(x, x, top + 1, bottom, 'P'); },
    prop: p => props.push(p),
    ent: e => ents.push(e),
    start: (x, row) => { startPos = { x: x * TS + 8, y: row * TS }; },
    check: (x, row = 13) => ents.push({ k: 'check', x: x * TS + 8, y: row * TS }),
    key(x, row, chainFrom) {
      ents.push({ k: 'key', x: x * TS + 8, y: row * TS + 6 });
      if (chainFrom != null) props.push({ k: 'chain', x: x * TS + 8, y0: chainFrom * TS, y1: row * TS });
    },
    door(x, row = 13) {
      props.push({ k: 'toilet', x: x * TS, y: row * TS, goal: true });
      ents.push({ k: 'door', x: x * TS + 24, y: row * TS - 26, w: 16, h: 26 });
    },
    mover: (x, row, w, rx, ry, period, ph = 0) => ents.push({ k: 'mover', x0: x * TS, y0: row * TS, w: w * TS, h: 8, rx: rx * TS, ry: ry * TS, period, ph }),
    spring: (x, row) => ents.push({ k: 'spring', x: x * TS + 8, y: row * TS }),
    vent: (x, row, h = 5) => ents.push({ k: 'vent', x: x * TS + 8, y: row * TS, h: h * TS, ph: (x * 37) % 200 }),
    crusher: (x, row) => ents.push({ k: 'crusher', x: x * TS, y0: row * TS, w: 32, h: 26 }),
    flow: (x0, x1, row, dir) => ents.push({ k: 'flow', x: x0 * TS, y: (row - 2) * TS, w: (x1 - x0 + 1) * TS, h: 2 * TS, dir }),
    spawner: (x, row) => ents.push({ k: 'spawner', x: x * TS + 8, y: row * TS }),
  };
  LEVELS[i].build(A);
  totalCoins = ents.filter(e => e.k === 'coin').length;
  for (const row of map) for (const c of row) if (c === '?') totalCoins++;
}

const solidCh = c => c === '#' || c === 'B' || c === '?' || c === '!' || c === 'P' || c === 'T' || c === 'I' || c === '<' || c === '>' || c === 'x';
function tileAt(tx, ty) { if (tx < 0 || tx >= COLS) return '#'; if (ty < 0 || ty >= ROWS) return '.'; return map[ty][tx]; }
function solidAt(tx, ty) { if (tx < 0 || tx >= COLS) return true; if (ty < 0 || ty >= ROWS) return false; return solidCh(map[ty][tx]); }

function collideX(b, v) {
  if (v === 0) return null;
  const y0 = Math.floor(b.y / TS), y1 = Math.floor((b.y + b.h - 0.01) / TS);
  const tx = v > 0 ? Math.floor((b.x + b.w - 0.01) / TS) : Math.floor(b.x / TS);
  const tiles = [];
  for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) tiles.push([tx, ty]);
  if (!tiles.length) return null;
  b.x = v > 0 ? tx * TS - b.w : (tx + 1) * TS;
  return { dir: Math.sign(v), tiles };
}
function collideY(b, prevBottom) {
  const x0 = Math.floor(b.x / TS), x1 = Math.floor((b.x + b.w - 0.01) / TS);
  if (b.vy > 0) {
    const ty = Math.floor((b.y + b.h - 0.01) / TS), tiles = [];
    for (let tx = x0; tx <= x1; tx++) {
      if (solidAt(tx, ty) || (tileAt(tx, ty) === '=' && prevBottom <= ty * TS + 0.01 && !(b.drop > 0))) tiles.push([tx, ty]);
    }
    if (!tiles.length) return null;
    b.y = ty * TS - b.h; return { dir: 1, tiles };
  } else if (b.vy < 0) {
    const ty = Math.floor(b.y / TS), tiles = [];
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) tiles.push([tx, ty]);
    if (!tiles.length) return null;
    b.y = (ty + 1) * TS; return { dir: -1, tiles };
  }
  return null;
}
function moveBody(b) {
  const v = b.vx + (b.push || 0) + (b.conv || 0);
  b.x += v;
  b.hitX = collideX(b, v);
  const prevBottom = b.y + b.h;
  b.y += b.vy;
  b.hitY = collideY(b, prevBottom);
  b.onGround = !!(b.hitY && b.hitY.dir > 0);
  b.conv = 0; b.ice = false; b.spiked = false;
  if (b.onGround) for (const [tx, ty] of b.hitY.tiles) {
    const c = map[ty][tx];
    if (c === '>') b.conv = 1.1; else if (c === '<') b.conv = -1.1; else if (c === 'I') b.ice = true; else if (c === 'x') b.spiked = true;
  }
  if (b.hitX) for (const [tx, ty] of b.hitX.tiles) if (map[ty][tx] === 'x') b.spiked = true;
}

let tileCv;
function crustDepth(gx, ty) {
  const cell = Math.floor(gx / 4), f = gx % 4, h = hash(cell, ty * 31 + 5);

  if (h > 0.6) { const L = 3 + Math.floor(hash(cell, ty * 17 + 9) * 8); d += (f === 0 || f === 3) ? Math.floor(L * 0.4) : L; }
  return d;
}
function paintSolid(g, tx, ty) {
  const s = theme.solid, X = tx * TS, Y = ty * TS;
  const up = ty > 0 && tileAt(tx, ty - 1) !== '#';
  const left = tx > 0 && tileAt(tx - 1, ty) !== '#', right = tx < COLS - 1 && tileAt(tx + 1, ty) !== '#';
  const down = ty < ROWS - 1 && tileAt(tx, ty + 1) !== '#';
  g.fillStyle = s.base; g.fillRect(X, Y, TS, TS);
  if (s.style === 'speck') {
    for (let i = 0; i < 6; i++) {
      g.fillStyle = i % 2 ? s.spk1 : s.spk2;
      g.fillRect(X + Math.floor(hash(tx * 7 + i, ty * 13) * 14), Y + Math.floor(hash(tx + i * 3, ty * 5 + i) * 15), 2, 1);

function step() {

  game.t++;

    case 'title':
      if (pressed.left && game.sel > 0) { game.sel--; loadLevel(game.sel); sfx.block(); }
      if (pressed.right && game.sel < game.unlocked) { game.sel++; loadLevel(game.sel); sfx.block(); }
      if (pressed.start || pressed.jump) startLevel(game.sel, true);
      break;
    case 'play':
      if (pressed.pause) { game.state = 'pause'; break; }
      if (freeze > 0) { freeze--; break; }
      game.time++;
      if (banner > 0) banner--;

      updatePlayer();
      if (game.state !== 'play') break;
      foeContacts(); updateFoes();
      if (boss) { updateBoss(); if (game.state !== 'play') break; bossContacts(); updateHazards(); }
      updateShots(); updateClouds(); updateItems(); updateParts(); updateCamera();
      if (shake > 0) shake *= 0.85; if (shake < 0.3) shake = 0;
      break;
    case 'pause':

      break;
    case 'clear':
      updatePlayer(); updateParts();
      if (game.t % 8 === 0) addPart({ x: p.x + 7 + (Math.random() - 0.5) * 80, y: p.y - 20 - Math.random() * 40, vx: 0, vy: -0.3, g: 0, life: 40, max: 40, col: [C.gold, C.gasL, C.heart][game.t % 3], size: 2 });

      break;
    case 'win':
      updateParts();
      if (game.t % 5 === 0) addPart({ x: Math.random() * LW, y: cam.y - 5, vx: (Math.random() - 0.5), vy: 1 + Math.random(), g: 0.02, life: 200, max: 200, col: [C.gold, C.gasL, C.heart, C.cupL][game.t % 4], size: 2 });

}

    else { ctx.globalAlpha = Math.min(1, a * 1.5); R(q.x, q.y, q.size, q.size, q.col); }
  }
  ctx.globalAlpha = 1;

  drawWeather(t, camX, camY);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const q of parts) if (q.kind === 'text') {
    ctx.globalAlpha = Math.min(1, q.life / 15);
    txt(q.text, (q.x - cx) * S, (q.y - cy) * S, 12, q.col, 'center');
  }
  ctx.globalAlpha = 1;
  if (showPlayer && p) for (const pr of props) {
    if (pr.k !== 'sign' || Math.abs(p.x + 7 - pr.x) > 34 || Math.abs(p.y + p.h - pr.y) > 40) continue;
    const lines = pr.text.split('\n');
    ctx.font = '12px ' + FONT;
    const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 28, bh = lines.length * 20 + 16;
    const bx = clamp((pr.x - cx) * S - bw / 2, 8, 952 - bw), by = Math.max(70, (pr.y - cy - 30) * S - bh);
    ctx.fillStyle = C.out; ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
    ctx.fillStyle = '#f7ecd6'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = C.out; ctx.fillRect((pr.x - cx) * S - 6, by + bh, 12, 8);
    lines.forEach((l, i) => txt(l, bx + bw / 2, by + 26 + i * 20, 12, '#3a1a5c', 'center', null));
  }
}

function drawHUD(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, 54);
  g.addColorStop(0, '#7a3fba'); g.addColorStop(1, '#4b2080');
  ctx.fillStyle = C.out; ctx.fillRect(0, 0, 960, 54);
  for (let x = 0; x < 960; x += 8) { const d = hash(x >> 3, 77) > 0.7 ? 6 + Math.floor(hash(x >> 3, 78) * 8) : 0; if (d) ctx.fillRect(x, 54, 8, d + 2); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, 960, 50);
  ctx.fillStyle = C.hudD; for (let x = 0; x < 960; x += 8) { const d = hash(x >> 3, 77) > 0.7 ? 6 + Math.floor(hash(x >> 3, 78) * 8) : 0; ctx.fillRect(x, 50, 8, 4 + d); }
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, 2, 960, 2);

  txt('SCORE', 18, 22, 10, '#d9b8ff');
  txt(String(game.score).padStart(6, '0'), 18, 44, 16);
  ctx.save(); ctx.beginPath(); ctx.rect(130, 0, 50, 50); ctx.clip();
  ctx.setTransform(2, 0, 0, 2, 146, 88); drawGloorbio(0, 0, 1, { t, eyes: t % 200 < 6 ? 'blink' : 'n' });
  ctx.restore(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  txt('x' + Math.max(0, game.lives), 184, 38, 16);
  for (let i = 0; i < 3; i++) pattern(HEART, 248 + i * 26, 8, 3, i < (p ? p.hearts : 3) ? PAL : { o: C.out, h: '#4a2a5e' });
  ctx.fillStyle = C.out; ctx.fillRect(248, 32, 74, 12);
  const gas = p ? p.gas : 100;
  ctx.fillStyle = gas >= 30 ? C.gas : '#6f8a3a'; ctx.fillRect(250, 34, Math.round(70 * gas / 100), 8);
  ctx.fillStyle = C.gasL; ctx.fillRect(250, 34, Math.round(70 * gas / 100), 2);
  ctx.fillStyle = 'rgba(27,16,38,0.6)'; ctx.fillRect(250 + 21, 34, 2, 8);
  txt('GAS', 330, 44, 10, C.gasL);
  ctx.fillStyle = C.out; ctx.fillRect(448, 2, 64, 62);
  ctx.fillStyle = C.gold; ctx.fillRect(451, 5, 58, 56);
  ctx.fillStyle = '#3a1764'; ctx.fillRect(455, 9, 50, 48);
  if (game.hasKey) pattern(KEY, 458, 22, 4, PAL);
  else { ctx.save(); ctx.translate(480, 33); ctx.rotate(0.5); pattern(PLUNGER, -12, -22, 3, PAL); ctx.restore(); }
  if (totalCoins > 0) {
    ctx.setTransform(2, 0, 0, 2, 0, 0); drawCoin(282, 13, t); ctx.setTransform(1, 0, 0, 1, 0, 0);
    txt(game.coins + '/' + totalCoins, 590, 38, 16);
  }
  const name = '[' + LEVELS[levelIdx].name + ']';
  txt(name, 944, 34, name.length > 19 ? 10 : 12, C.hudText, 'right');
  if (muted) txt('MUTED', 944, 76, 10, '#d9b8ff', 'right');

  if (boss && boss.st !== 'intro' && boss.st !== 'dead') {
    ctx.fillStyle = C.out; ctx.fillRect(276, 500, 408, 22);
    ctx.fillStyle = '#3a0a14'; ctx.fillRect(280, 504, 400, 14);
    ctx.fillStyle = boss.phase > 1 ? '#ff5a3a' : C.cup; ctx.fillRect(280, 504, Math.round(400 * boss.hp / boss.max), 14);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(280, 504, Math.round(400 * boss.hp / boss.max), 3);
    txt('UNSTOPPABLE SHITTY PLUNGER', 480, 494, 12, '#ffffff', 'center');
  }
}

function levelLabel(i) { return LEVELS[i].boss ? 'BOSS: ' + LEVELS[i].name : (i + 1) + '. ' + LEVELS[i].name; }
function drawTitle(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(18,10,28,0.55)'; ctx.fillRect(0, 0, 960, 540);
  outlined("GLOORBIO'S", 480, 86, 28, '#d9b8ff', C.out, 10);
  const bob = Math.round(Math.sin(t * 0.06) * 4);
  outlined('POOPY LAND', 480, 150 + bob, 52, C.gold, '#3a1764', 16);
  outlined('POOPY LAND', 480, 150 + bob, 52, C.gold, C.out, 6);
  ctx.setTransform(4, 0, 0, 4, 200, 390); drawGloorbio(0, 0, 1, { t, bodyY: (t >> 5) & 1, mouth: (t % 120) < 50 ? 'grin' : 'teeth' });
  ctx.setTransform(3, 0, 0, 3, 740, 390); drawPoop(0, 0, -1, { t }); ctx.setTransform(3, 0, 0, 3, 820, 330 + Math.round(Math.sin(t * 0.08) * 6)); drawPoop(0, 0, -1, { t, wings: true });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const rows = [['LEFT RIGHT', 'WALK'], ['SPACE / UP', 'JUMP'], ['X / SHIFT', 'SHOULDER BASH'], ['DOWN IN AIR', 'GROUND POUND'], ['Z', 'PLUNGER'], ['C', 'CHOMP'], ['V', 'WAFT'], ['P   M', 'PAUSE  MUTE']];
  ctx.fillStyle = 'rgba(27,16,38,0.82)'; ctx.fillRect(330, 186, 300, rows.length * 22 + 20);
  rows.forEach(([k, v], i) => { txt(k, 346, 216 + i * 22, 10, C.gold, 'left', null); txt(v, 614, 216 + i * 22, 10, '#f2e6ff', 'right', null); });
  // level select
  ctx.fillStyle = 'rgba(27,16,38,0.82)'; ctx.fillRect(250, 396, 460, 40);
  const sel = levelLabel(game.sel);
  txt(sel, 480, 423, sel.length > 26 ? 10 : 12, LEVELS[game.sel].boss ? '#ff8a7a' : '#ffffff', 'center', null);
  if (game.sel > 0) txt('<', 268, 424, 14, C.gold, 'left', null);
  if (game.sel < game.unlocked) txt('>', 692, 424, 14, C.gold, 'right', null);
  if ((t >> 5) & 1) outlined('PRESS ENTER OR TAP TO START', 480, 472, 16, '#ffffff', C.out, 6);
  txt(game.unlocked > 0 ? 'LEFT/RIGHT: CHOOSE LEVEL' : 'CLEAR A LEVEL TO UNLOCK THE NEXT', 480, 504, 10, '#d9b8ff', 'center');
  if (game.best) txt('BEST ' + String(game.best).padStart(6, '0'), 480, 526, 10, C.gold, 'center');
}
function drawPanel(title, lines, t, foot, col = C.gold) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(18,10,28,0.6)'; ctx.fillRect(0, 0, 960, 540);
  const h = 130 + lines.length * 30, w = 520, x0 = 480 - w / 2;
  ctx.fillStyle = C.out; ctx.fillRect(x0 - 6, 270 - h / 2 - 6, w + 12, h + 12);
  ctx.fillStyle = col; ctx.fillRect(x0 - 2, 270 - h / 2 - 2, w + 4, h + 4);
  ctx.fillStyle = '#2e1250'; ctx.fillRect(x0 + 4, 270 - h / 2 + 4, w - 8, h - 8);
  outlined(title, 480, 270 - h / 2 + 56, title.length > 16 ? 22 : 28, col, C.out, 8);
  lines.forEach((l, i) => {
    const y = 270 - h / 2 + 100 + i * 30;
    if (Array.isArray(l)) { txt(l[0], x0 + 36, y, 12, '#f2e6ff', 'left', null); txt(l[1], x0 + w - 36, y, 12, C.gold, 'right', null); }
    else txt(l, 480, y, 12, '#f2e6ff', 'center', null);
  });
  if (foot && (t >> 5) & 1) txt(foot, 480, 270 + h / 2 - 22, 10, '#ffffff', 'center', null);
}

let titleCam = 0;
function render() {
  const t = game.t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (game.state === 'title') {
    if (LW > W) titleCam = (titleCam + 0.4) % (LW - W); else titleCam = 0;
    renderWorld(t, titleCam, LH - H, false);
    drawTitle(t);
    return;
  }
  renderWorld(t, cam.x, cam.y, true);
  drawHUD(t);
  const L = LEVELS[levelIdx];
  if (game.state === 'play' && banner > 0 && !L.boss) {
    ctx.globalAlpha = Math.min(1, banner / 30);
    outlined(L.name, 480, 210, L.name.length > 16 ? 26 : 32, C.gold, C.out, 10);
    outlined(L.sub, 480, 250, 14, '#ffffff', C.out, 6);
    ctx.globalAlpha = 1;
  }
  if (boss && boss.st === 'intro' && boss.t > 80) {
    const a = Math.min(1, (boss.t - 80) / 20, (205 - boss.t) / 20);
    if (a > 0) {
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(20,0,10,0.6)'; ctx.fillRect(0, 150, 960, 150);
      outlined('THE UNSTOPPABLE', 480, 210, 30, '#ffffff', C.out, 10);
      outlined('SHITTY PLUNGER', 480, 262, 40, C.cupL, C.out, 12);
      ctx.globalAlpha = 1;
    }
  }
  if (game.state === 'pause') drawPanel('PAUSED', [['MOVE', 'ARROWS / A D'], ['JUMP', 'SPACE / UP'], ['BASH', 'X / SHIFT'], ['GROUND POUND', 'DOWN IN AIR'], ['PLUNGER / CHOMP', 'Z / C'], ['WAFT', 'V'], ['MUTE', 'M']], t, 'P OR ENTER TO RESUME');
  if (game.state === 'over') drawPanel('GAME OVER', ['GLOORBIO GOT FLUSHED.', ['SCORE', String(game.score).padStart(6, '0')], ['BEST', String(game.best).padStart(6, '0')]], t, 'ENTER OR TAP FOR THE MENU');
  if (game.state === 'clear' && game.t > 40) {
    const T = game.tally, next = LEVELS[levelIdx + 1];
    drawPanel('COURSE CLEAR!', [
      ['COINS ' + game.coins + '/' + totalCoins, '+' + T.coinB], ['TIME ' + T.secs + 's', '+' + T.timeB], ['LIVES LEFT', '+' + T.lifeB],
      ['ALL COINS', T.allB ? '+' + T.allB : '-'], ['TOTAL', String(game.score).padStart(6, '0')],
      'NEXT: ' + (next.boss ? 'BOSS FIGHT!' : next.name)], t, game.t > 120 ? 'ENTER OR TAP TO CONTINUE' : '');
  }
  if (game.state === 'win' && game.t > 60) {
    drawPanel('YOU WIN!', ['THE UNSTOPPABLE SHITTY PLUNGER', 'HAS BEEN UNCLOGGED.', 'GLOORBIO IS KING OF POOPY LAND!', ['FINAL SCORE', String(game.score).padStart(6, '0')], game.tally.newBest ? 'NEW BEST SCORE!' : ['BEST', String(game.best).padStart(6, '0')]], t, game.t > 150 ? 'ENTER OR TAP FOR THE MENU' : '', C.cupL);
  }
}

let last = performance.now(), acc = 0;
const DT = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= DT) { step(); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}

loadLevel(game.sel);
if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"').catch(() => {});
window.__gloorbio = { game, LEVELS, get p() { return p; }, get foes() { return foes; }, get items() { return items; }, get gadgets() { return gadgets; },
  get boss() { return boss; }, get map() { return map; }, get level() { return levelIdx; }, keys, pressed, step, render, startLevel, loadLevel };
requestAnimationFrame(frame);
})();
