<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Super Shitty Mario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0f0c0a; --ink: #cfc3ad; --muted: #8c8070; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 35%, #2b221c 0%, var(--bg) 75%);
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; gap: 14px;
    overflow-x: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    font-family: "Press Start 2P", monospace;
  }

  /* ---------- the handheld ---------- */
  .console {
    width: min(100%, 560px, calc((100vh - 90px) * 0.86));
    container-type: inline-size;
    position: relative;
    background: linear-gradient(165deg, #d9d4c7 0%, #c4beb0 55%, #aca697 100%);
    border-radius: 3cqw 3cqw 13cqw 3cqw;
    padding: 4.5cqw 4.5cqw 7cqw;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.65), inset 0 -5px 0 rgba(0,0,0,.14),
                inset 3px 0 0 rgba(255,255,255,.25), 0 28px 60px rgba(0,0,0,.65);
  }
  .console::before { /* years of grime */
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at 82% 88%, rgba(90,70,40,.20), transparent 38%),
                radial-gradient(circle at 8% 24%, rgba(90,70,40,.13), transparent 30%),
                radial-gradient(circle at 60% 60%, rgba(90,70,40,.08), transparent 25%);
  }
  .bezel {
    position: relative; background: #5b5d6c;
    border-radius: 2cqw 2cqw 8cqw 2cqw;
    padding: 7cqw 9cqw 6cqw;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.55);
  }
  .stripe {
    position: absolute; top: 2.6cqw; left: 3cqw; right: 3cqw;
    display: flex; align-items: center; gap: 1.6cqw;
    font: 1.5cqw/1 "Press Start 2P", monospace; color: #b9bccb; white-space: nowrap;
  }
  .stripe i { flex: 1; height: 1.4cqw; background: linear-gradient(#8e2c48 0 33%, transparent 33% 66%, #2c3a8e 66%); }
  .led {
    position: absolute; left: 2.6cqw; top: 42%;
    display: flex; flex-direction: column; align-items: center; gap: 1.2cqw;
    font: 1.1cqw/1 "Press Start 2P", monospace; color: #b9bccb;
  }
  .led b { width: 2cqw; height: 2cqw; border-radius: 50%; background: #ff3b2a; box-shadow: 0 0 1.6cqw #ff3b2a; }
  .screen {
    position: relative; aspect-ratio: 4 / 3; background: #000; border-radius: .8cqw; overflow: hidden;
    box-shadow: 0 0 0 .5cqw #17130f, 0 0 5cqw 1cqw rgba(255,128,40,.32);
  }
  .screen canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: crisp-edges; image-rendering: pixelated;
    filter: saturate(1.08) contrast(1.06);
  }
  .screen::after { /* scanlines + vignette */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, rgba(255,150,60,.06) 0%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .screen::before { /* glass glare */
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: linear-gradient(125deg, rgba(255,255,255,.09) 0%, transparent 35%);
  }
  .brand {
    margin: 2.8cqw 0 0 1cqw;
    font: italic 900 5.2cqw/1 "Arial Black", Impact, sans-serif; color: #2d3087; letter-spacing: -.04em;
  }
  .brand small { font: 700 2.4cqw/1 Arial, sans-serif; letter-spacing: 0; font-style: normal; vertical-align: top; }

  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 6cqw; padding: 0 2cqw; }
  button { -webkit-tap-highlight-color: transparent; touch-action: none; cursor: pointer; border: 0; padding: 0; }
  .dpad { width: 27cqw; height: 27cqw; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
  .dpad > * { background: #26262b; box-shadow: 0 .6cqw 0 #111; }
  .dpad .up    { grid-area: 1 / 2; border-radius: 1cqw 1cqw 0 0; }
  .dpad .left  { grid-area: 2 / 1; border-radius: 1cqw 0 0 1cqw; }
  .dpad .mid   { grid-area: 2 / 2; }
  .dpad .right { grid-area: 2 / 3; border-radius: 0 1cqw 1cqw 0; }
  .dpad .down  { grid-area: 3 / 2; border-radius: 0 0 1cqw 1cqw; }
  .ab { display: flex; gap: 5cqw; transform: rotate(-25deg); margin-right: 2cqw; }
  .btn { display: flex; flex-direction: column; align-items: center; gap: 1.6cqw; font: 2cqw/1 "Press Start 2P", monospace; color: #2d3087; }
  .btn:nth-child(2) { margin-top: -6cqw; }
  .btn button {
    width: 12.5cqw; height: 12.5cqw; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #b8336a, #7d1840 70%);
    box-shadow: 0 .8cqw 0 #4a0d25, 0 1.2cqw 2cqw rgba(0,0,0,.3);
  }
  .pills { display: flex; justify-content: center; gap: 6cqw; margin-top: 6cqw; transform: translateX(-3cqw); }
  .pills div { display: flex; flex-direction: column; align-items: center; gap: 1.4cqw; font: 1.6cqw/1 "Press Start 2P", monospace; color: #2d3087; transform: rotate(-25deg); }
  .pill { width: 11cqw; height: 3cqw; border-radius: 2cqw; background: #76757e; box-shadow: 0 .5cqw 0 #4a4950; }
  button.down { transform: translateY(.5cqw); filter: brightness(.85); }
  .speaker {
    position: absolute; right: 5cqw; bottom: 5cqw; width: 16cqw; height: 12cqw; transform: rotate(-25deg);
    background: repeating-linear-gradient(90deg, transparent 0 1.6cqw, rgba(0,0,0,.28) 1.6cqw 2.6cqw);
    border-radius: 1cqw;
  }
  .help { font-size: 9px; line-height: 2; color: var(--muted); text-align: center; max-width: 560px; }
  .help b { color: var(--ink); font-weight: normal; }
</style>
</head>
<body>
  <div class="console">
    <div class="bezel">
      <div class="stripe"><i></i><span>DOT MATRIX WITH STEREO SMELL</span><i></i></div>
      <div class="led"><b></b>STINK</div>
      <div class="screen"><canvas id="game" width="320" height="240"></canvas></div>
    </div>
    <div class="brand">Broke Boy<small>™</small></div>
    <div class="controls">
      <div class="dpad">
        <button class="up" data-btn="up" aria-label="Up / jump"></button>
        <button class="left" data-btn="left" aria-label="Left"></button>
        <div class="mid"></div>
        <button class="right" data-btn="right" aria-label="Right"></button>
        <button class="down" data-btn="down" aria-label="Down"></button>
      </div>
      <div class="ab">
        <div class="btn"><button data-btn="attack" aria-label="B: plunge"></button>B · PLUNGE</div>
        <div class="btn"><button data-btn="jump" aria-label="A: jump"></button>A · JUMP</div>
      </div>
    </div>
    <div class="pills">
      <div><button class="pill" data-btn="select" aria-label="Select: mute"></button>SELECT</div>

    </div>
    <div class="speaker"></div>
  </div>
  <p class="help">
    <b>← →</b> MOVE &nbsp;·&nbsp; <b>Z / SPACE / ↑</b> JUMP &nbsp;·&nbsp; <b>X / J</b> PLUNGE<br>
    <b>ENTER</b> START / PAUSE &nbsp;·&nbsp; <b>↑ ↓</b> MENUS &nbsp;·&nbsp; <b>M</b> MUTE
  </p>

<script>
'use strict';
// ======================================================================
//  SUPER SHITTY MARIO
// ======================================================================
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 320, H = 240, TS = 16, ROWS = 15;
const GROUND_Y = 13 * TS;
const SLUDGE_Y = 14 * TS + 4;

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.random() * a.length | 0];
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pad = (n, l) => String(n).padStart(l, '0');
function hash(x, y) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function mulberry(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mk(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  fn(g, (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); });
  return c;
}
function sprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length));
  return mk(w, rows.length, (g, p) => rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) { const c = pal[r[x]]; if (c) p(x, y, 1, 1, c); }
  }));
}
const flipped = c => mk(c.width, c.height, g => { g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); });
function ell(x, y, rx, ry) {
  if (rx <= 0 || ry <= 0) return;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}

// ---------------------------------------------------------------- sprites
const SPR = {};
const P_TOP = [
  '....hhhhhh......',
  '...hhhwwhhhh....',
  '..hhhhwwhhhhhhh.',
  '..kkHHHHHHHHHHH.',
  '..kkssskkkkss...',
  '..kSssskekkss...',
  '..kSssskkkksss..',
  '...Ssssssssssss.',
  '....ssssmmmmmmm.',
  '.....sssssmmm...',
  '.....cccccc.....',
  '....ccoccocc....',
  '...cccoccocccs..',
  '...ccoyooyooss..',
];
const LEGS = {
  stand: ['....oooooooo....', '....ooooOooo....', '....oooo.ooo....', '....OOOO.OOO....', '...bbbbb.bbbb...', '...bbbbb.bbbbb..'],
  walk:  ['....oooooooo....', '...ooOoo.ooo....', '..ooo.....ooo...', '..OOO......OOO..', '.bbbb......bbbb.', '.bbb........bbb.'],
  jump:  ['....oooooooo....', '...oooo.oooo....', '..ooo.....oOO...', '.bbbb.....bbbb..', '.bbb........bbb.', '................'],
};
const PAL_P = { h: '#7d7260', H: '#5a5244', w: '#e8dcc0', k: '#1d130c', s: '#e3b58c', S: '#b5835e', e: '#f4eedc',
  m: '#3b2416', c: '#8e8878', o: '#5b4b3a', O: '#40342a', y: '#d7a94a', b: '#2e1e14' };
const PAL_GOLD = { ...PAL_P, h: '#c9a23a', H: '#8f6e1e', w: '#fff3c0', c: '#a8a28a' };
function playerSet(pal) {
  const out = {};
  for (const [n, legs] of Object.entries(LEGS)) { const s = sprite(P_TOP.concat(legs), pal); out[n] = [s, flipped(s)]; }
  return out;
}
SPR.player = [playerSet(PAL_P), playerSet(PAL_GOLD)];

const PAL_G = { d: '#7b4a28', l: '#d1a875', k: '#24150b', e: '#efe4cc', b: '#3d2414' };
const G_TOP = [
  '......kkkk......',
  '....kkddddkk....',
  '...kddddddddk...',
  '..kddddddddddk..',
  '.kdkkkddddkkkdk.',
  '.kddkekddkekddk.',
  'kdddkeekkeekdddk',
  'kdddkekddkekdddk',
  'kddddkkddkkddddk',
  '.kddddddddddddk.',
  '..kkdkkkkkkdkk..',
  '....kllllllk....',
  '...kllllllllk...',
];
SPR.goomba = [
  sprite(G_TOP.concat(['..kbbkllllkbbk..', '.kbbbbk..kbbbbk.', '.kkkkk....kkkkk.']), PAL_G),
  sprite(G_TOP.concat(['...kbbkllkbbk...', '..kbbbbkkbbbbk..', '..kkkkk..kkkkk..']), PAL_G),
];
const PAL_R = { g: '#6d675a', k: '#221a12', e: '#e85030', p: '#d4887a', t: '#b88a72', f: '#3a2a1e' };
const R_TOP = [
  '..........kk....',
  '.........kggk...',
  '....kkkkkggggk..',
  '..kkgggggggggekk',
  '.kggggggggggggpk',
  'kggggggggggggkk.',
  't.kgggggggggk...',
];
SPR.rat = [
  R_TOP.concat(['tt.kkfkkkkfkk...', '.tt.kf...kf.....', '..ttt...........']),
  R_TOP.concat(['tt.kfkkkkkfk....', '.tt..kf..kf.....', '..ttt...........']),
].map(r => { const s = sprite(r, PAL_R); return [s, flipped(s)]; });
const PAL_TURD = { k: '#24140a', b: '#6b4422', B: '#8e5c2c', w: '#f0e8d8', r: '#5a0a0a', d: '#3a200c' };
const TURD_TOP = [
  '.......kk.......',
  '......kBbk......',
  '.....kbbbbk.....',
  '....kkbbbbkk....',
  '...kbBBbbbbbk...',
  '..kbwwkbbkwwbk..',
  '..kbwkkbbkkwbk..',
  '..kkbbbbbbbbkk..',
  '.kbBBbbbbbbbbbk.',
  'kbbbkkkkkkkkbbbk',
  'kbbbbkrrrrkbbbbk',
  '.kkbbbkkkkbbbkk.',
  '...kkkkkkkkkk...',
];
SPR.turd = [
  sprite(TURD_TOP.concat(['..kdk......kdk..']), PAL_TURD),
  sprite(TURD_TOP.concat(['.kdk........kdk.']), PAL_TURD),
];
const PAL_BOWL = { k: '#2a2020', w: '#e8e4d8', s: '#b8b0a0', L: '#d0c8b8', e: '#ff3020', b: '#7a4a20', r: '#4a0808', t: '#fffff0' };
const BOWL_BOTTOM = [
  '.kwwwkekwwwkekk.',
  '..kwwwwwwwwwwk..',
  '...kwwwwwwwwk...',
  '....kbwwwwsk....',
  '.....kwwwsk.....',
  '.....kwwwsk.....',
  '....kwwwwwsk....',
  '....kkkkkkkk....',
];
SPR.bowl = [
  ['kkkkkk..........', 'kwwwsk..........', 'kwwwsk..........', 'kwwwsk..........', 'kwwwskkkkkkkkkk.',
   'kwwwskLLLLLLLLLk', 'kkkkkkkkkkkkkkkk', '.kwwwwwwwwwwwwk.'],
  ['kkkkkkkk........', 'kwwwskLk........', 'kwwwskLk........', 'kwwwskLk........', 'kwwwskLk........',
   'kwwwskkkkkkkkkkk', 'kwwwskrtrtrtrtrk', '.kwwwwrrrrrrrrk.'],
].map(top => { const s = sprite(top.concat(BOWL_BOTTOM), PAL_BOWL); return [s, flipped(s)]; });
SPR.shroom = sprite([
  '.....kkkkkk.....',
  '...kkgggGGgkk...',
  '..kgggGGggggGk..',
  '.kgGGgggggGGggk.',
  '.kgGGggggGGGggk.',
  'kgggggGGgggggggk',
  'kggGgggGGggGGggk',
  'kkkkkkkkkkkkkkkk',
  '...kllllllllk...',
  '...kllkllkllk...',
  '...kllllllllk...',
  '...kllkkkkllk...',
  '....kllllllk....',
  '.....kkkkkk.....',
], { k: '#24150b', g: '#8a7a3a', G: '#8fc040', l: '#e3d2a8' });
SPR.skull = sprite(['.www.', 'wwwww', 'wkwkw', 'wwwww', '.w.w.'], { w: '#f0e6cc', k: '#3a2010' });

// ---------------------------------------------------------------- tiles
const PIPE_PALS = [
  { o: '#13240e', d: '#2a4e1f', m: '#3e782b', l: '#6da447', h: '#b0da76', slime: '#9ad040', slime2: '#b8e868' },
  { o: '#1c1616', d: '#4a4240', m: '#77706a', l: '#a39b92', h: '#d6cec2', slime: '#7a4a20', slime2: '#a8703a' },
];
function bodyCol(PC, c) {
  if (c < 2 || c > 29) return null;
  if (c === 2 || c === 29) return PC.o;
  if (c <= 3) return PC.m; if (c <= 5) return PC.h; if (c <= 9) return PC.l; if (c <= 21) return PC.m;
  return PC.d;
}
function lipCol(PC, c) {
  if (c === 0 || c === 31) return PC.o;
  if (c <= 1) return PC.m; if (c <= 3) return PC.h; if (c <= 8) return PC.l; if (c <= 22) return PC.m;
  return PC.d;
}
function brickTile(moss) {
  return mk(16, 16, (g, p) => {
    p(0, 0, 16, 16, '#8a4a2b');
    [[0, [7, 15]], [8, [3, 11]]].forEach(([y, vs]) => {
      p(0, y, 16, 1, '#b4693d'); p(0, y + 6, 16, 1, '#65341e');
      vs.forEach(v => p(v, y, 1, 7, '#3a2216'));
    });
    p(0, 7, 16, 1, '#3a2216'); p(0, 15, 16, 1, '#3a2216');
    if (moss) { p(0, 0, 5, 1, '#6f8a2e'); p(1, 1, 2, 1, '#6f8a2e'); p(10, 8, 4, 1, '#6f8a2e'); p(11, 9, 1, 2, '#6f8a2e'); }
  });
}
function porcelainTile(stain) { // grimy bathroom tiles, the world 2 "brick"
  return mk(16, 16, (g, p) => {
    p(0, 0, 16, 16, '#7e7666');
    for (const [x, y] of [[0, 0], [8, 0], [0, 8], [8, 8]]) {
      p(x, y, 7, 7, '#e6e0d2'); p(x, y, 7, 1, '#fbf8ef'); p(x, y, 1, 7, '#fbf8ef');
      p(x + 6, y + 1, 1, 6, '#bdb5a4'); p(x + 1, y + 6, 6, 1, '#bdb5a4');
    }
    p(12, 9, 1, 3, '#5a5248'); p(11, 12, 1, 2, '#5a5248');
    if (stain) { p(2, 9, 4, 2, '#8a5a2a'); p(3, 11, 2, 3, '#7a4a20'); p(10, 2, 3, 1, '#9a6a34'); }
  });
}
const QG = ['.kkkk.', 'kk..kk', '....kk', '...kk.', '..kk..', '......', '..kk..'];
function makeTileset(world) {
  const T = {}, mud = world === 1, PC = PIPE_PALS[world];
  const gb = mud ? ['#3e2614', '#2e1a0c', '#5a3a1e'] : ['#4a3820', '#3a2a16', '#5e4a2c'];
  T.ground = mk(16, 16, (g, p) => {
    const r = mulberry(7); p(0, 0, 16, 16, gb[0]);
    for (let i = 0; i < 18; i++) p(r() * 16 | 0, r() * 16 | 0, 1 + (r() * 2 | 0), 1, r() < .5 ? gb[1] : gb[2]);
  });
  T.groundTop = mk(16, 16, (g, p) => {
    const r = mulberry(11); g.drawImage(T.ground, 0, 0);
    if (mud) {
      p(0, 0, 16, 4, '#7a4e26'); p(0, 0, 16, 1, '#b07a3e'); p(0, 1, 16, 1, '#946232');
      for (let x = 0; x < 16; x++) { const d = r() * 6 | 0; if (d > 1) p(x, 4, 1, d - 1, '#7a4e26'); }
      p(3, 1, 2, 1, '#c89050'); p(11, 2, 1, 1, '#c89050');
    } else {
      p(0, 0, 16, 3, '#56662a'); p(0, 0, 16, 1, '#86983e'); p(0, 1, 16, 1, '#6e7f34');
      for (let x = 0; x < 16; x++) { const d = r() * 3 | 0; if (d) p(x, 3, 1, d, '#56662a'); }
    }
  });
  T.brick = mud ? [porcelainTile(false), porcelainTile(true)] : [brickTile(false), brickTile(true)];
  T.q = ['#b97d2c', '#c98d36', '#dba24a'].map(base => mk(16, 16, (g, p) => {
    p(0, 0, 16, 16, '#46280e'); p(1, 1, 14, 14, base);
    p(1, 1, 14, 1, '#ecc679'); p(1, 1, 1, 14, '#ecc679'); p(1, 14, 14, 1, '#7a4a16'); p(14, 1, 1, 14, '#7a4a16');
    [[3, 3], [12, 3], [3, 12], [12, 12]].forEach(([x, y]) => p(x, y, 1, 1, '#46280e'));
    QG.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === 'k') p(6 + x, 5 + y, 1, 1, '#7a4a16'); }));
    QG.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === 'k') p(5 + x, 4 + y, 1, 1, '#4a2a0c'); }));
  }));
  T.used = mk(16, 16, (g, p) => {
    p(0, 0, 16, 16, '#2e1d10'); p(1, 1, 14, 14, '#5c4430'); p(1, 1, 14, 1, '#76583e');
    [[2, 2], [13, 2], [2, 13], [13, 13]].forEach(([x, y]) => p(x, y, 1, 1, '#2e1d10'));
  });
  const hc = mud ? ['#2e2438', '#8a7e96', '#5e5268', '#685c72', '#3a3044'] : ['#3f382c', '#a49a82', '#7a705c', '#857a64', '#4a4234'];
  T.hard = mk(16, 16, (g, p) => {
    p(0, 0, 16, 16, hc[0]); p(0, 0, 15, 15, hc[1]); p(1, 1, 14, 14, hc[2]); p(3, 3, 10, 10, hc[3]);
    [[3, 3], [12, 3], [3, 12], [12, 12]].forEach(([x, y]) => p(x, y, 1, 1, hc[4]));

function factoryBackground(idx, lw) {
  const r = mulberry(1000 + idx * 77);

  const far = mk(farW, H, (g, p) => {
    let x = -10;

      const w = 14 + r() * 40 | 0, h = 30 + r() * 60 | 0, top = 170 - h;
      p(x, top, w, H - top, '#b19c74');
      if (r() < .5) { const sw = 3 + (r() * 3 | 0), sh = 15 + r() * 35 | 0; p(x + 2 + (r() * (w - 6) | 0), top - sh, sw, sh, '#b19c74'); }
      x += w + (r() * 4 | 0);
    }
  });
  const stacks = [];
  const near = mk(nearW, H, (g, p) => {
    let x = -10;
    while (x < nearW) {
      const w = 24 + r() * 50 | 0, h = 20 + r() * 50 | 0, top = 185 - h;
      p(x, top, w, H - top, '#8c7752');
      if (r() < .35) for (let k = 0; k + 8 <= w; k += 8) for (let j = 0; j < 6; j++) p(x + k, top - 6 + j, 6 - j, 1, '#8c7752');
      for (let wy = top + 5; wy < 185; wy += 7)
        for (let wx = x + 3; wx < x + w - 4; wx += 6)
          if (r() < .45) p(wx, wy, 3, 3, r() < .15 ? '#d9a85a' : '#6e5c3e');
      if (r() < .55) {
        const sw = 5 + (r() * 4 | 0), sh = 25 + r() * 45 | 0, sx = x + 3 + (r() * Math.max(1, w - 10) | 0);
        p(sx, top - sh, sw, sh, '#7c6848'); p(sx - 1, top - sh, sw + 2, 2, '#6e5c3e');
        stacks.push({ x: sx + sw / 2, y: top - sh, s: r() * 10 });

    }

}

function buildLevel(idx) {
  const def = LEVELS[idx], w = def.width;
  TH = THEMES[def.world]; T = TILESETS[def.world]; SLIME = TH.slime;
  const tiles = []; for (let y = 0; y < ROWS; y++) tiles.push(new Uint8Array(w));
  const lv = { idx, def, w, tiles, enemies: [], coins: [], sources: [], hpipes: [], props: [], cracks: new Set(),
    goal: null, boss: null, mid: def.mid, items: [], bumps: new Map(), bg: makeBackground(idx, w) };
  const set = (x, y, v) => { if (x >= 0 && x < w && y >= 0 && y < ROWS) tiles[y][x] = v; };
  const b = {
    ground(x0, x1, top = 13) { for (let x = x0; x <= x1; x++) for (let y = top; y < ROWS; y++) set(x, y, 1); },
    sludge(x0, x1) { for (let x = x0; x <= x1; x++) { set(x, 13, 0); set(x, 14, 13); } },
    row(x, y, s) {
      [...s].forEach((c, i) => { const v = { B: 2, '?': 3, M: 4, U: 5, H: 6 }[c]; if (v) set(x + i, y, v); else if (c === 'o') b.coin(x + i, y); });
    },
    coin(x, y) { lv.coins.push({ x: x * 16 + 4, y: y * 16 + 2, w: 8, h: 12, taken: false }); },
    coins(x, y, n) { for (let i = 0; i < n; i++) b.coin(x + i, y); },
    pipe(x, h, leak, snake) {
      const top = 13 - h;
      set(x, top, 7); set(x + 1, top, 8);
      for (let y = top + 1; y < 13; y++) { set(x, y, 9); set(x + 1, y, 10); }
      if (leak && h >= 2) {
        lv.cracks.add((top + 1) * w + x);
        lv.sources.push({ kind: 'spurt', x: x * 16 + 1, y: (top + 1) * 16 + 8, dir: -1, t: 60 + Math.random() * 80 | 0 });
        lv.sources.push({ kind: 'spurt', x: (x + 2) * 16 - 1, y: (top + 1) * 16 + 8, dir: 1, t: 120 + Math.random() * 80 | 0 });
      }
      if (snake) {
        lv.enemies.push({ type: 's', active: false, dead: null, x: x * 16 + 11, y: top * 16, w: 10, h: 1, baseY: top * 16,
          rise: 0, phase: 'wait', st: Math.random() * 80 | 0, t: 0, vx: 0, vy: 0, dir: -1 });

    pipeDown(x, len) {
      for (let y = 0; y < len - 1; y++) { set(x, y, 9); set(x + 1, y, 10); }
      set(x, len - 1, 11); set(x + 1, len - 1, 12);
      lv.sources.push({ kind: 'drip', x: x * 16 + 16, y: len * 16, dir: 0, t: 40 + Math.random() * 60 | 0 });
    },
    stairs(x, n, up = true) {
      for (let i = 0; i < n; i++) { const h = up ? i + 1 : n - i; for (let j = 0; j < h; j++) set(x + i, 12 - j, 6); }

  if (s === 12) { g.open = false; SFX.door(); }
  if (s === 30) SFX.flush();
  g.shake = s > 30 && s < 110 ? 1 : 0;
  if (s > 30 && s < 150 && s % 5 === 0) part(g.x + 16 + rand(-12, 12), g.y + 2, rand(-.3, .3), -rand(.4, .9), pick(SLIME), 50, 2, -.005, true);
  if (s === 120) { SFX.jingle(); addScore(1000, g.x + 16, g.y - 14, 'FLUSHED! +1000'); }
  if (s > 270) {
    game.powered = player.powered;
    markCleared(LEVELS[game.levelIndex].name);
    game.levelIndex++; game.checkpoint = false;
    if (game.levelIndex >= LEVELS.length) { game.levelIndex = LEVELS.length - 1; saveHi(); setState('win'); SFX.jingle(); }
    else { loadLevel(game.levelIndex, false); setState('intro'); }
  }
}
function updateParticles() {
  for (const p of particles) { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.t++; p.y -= .5; }
  popups = popups.filter(p => p.t < 50);
}
function updateSelect() {
  let s = game.sel;
  if (pressed.left) s--;
  if (pressed.right) s++;
  if (pressed.up) s -= 3;
  if (pressed.down) s += 3;
  s = clamp(s, 0, LEVELS.length - 1);
  if (s !== game.sel) { game.sel = s; SFX.blip(); previewLevel(s); }
  cam.x = (Math.sin(game.t * .003) * .5 + .5) * (L.w * 16 - W) * .6;
  if (pressed.jump || pressed.start) startGame(game.sel);
  else if (pressed.attack) { SFX.blip(); toTitle(); }
}
function update() {
  game.t++; game.stateT++;
  if (pressed.select) toggleMute();
  const inMenu = game.state === 'title' || game.state === 'select';
  if (!inMenu && pressed.up) pressed.jump = true;
  const go = pressed.start || pressed.jump;
  switch (game.state) {
    case 'title':
      cam.x = (Math.sin(game.t * .003) * .5 + .5) * (L.w * 16 - W) * .6;
      if (pressed.up || pressed.down) { game.menu ^= 1; SFX.blip(); }
      if (go) {
        if (game.menu === 0) startGame(0);
        else { setState('select'); previewLevel(game.sel); SFX.blip(); }
      }
      break;
    case 'select': updateSelect(); break;
    case 'intro':
      if (game.stateT > 140 || (game.stateT > 30 && pressed.start)) { setState('play'); Music.start(LEVELS[game.levelIndex].song); }
      break;
    case 'play': updatePlay(); break;
    case 'paused':
      if (pressed.start) {
        setState('play');
        const B = L.boss;
        Music.start(B && B.locked && B.state !== 'gone' && B.state !== 'dying' ? 3 : LEVELS[game.levelIndex].song);
      }
      break;
    case 'dying': updateDying(); break;
    case 'clear': updateClear(); break;
    case 'gameover': case 'win':
      if (game.stateT > 60 && go) toTitle();
      break;
  }
  if (cam.shake > 0) { cam.shake *= .85; if (cam.shake < .3) cam.shake = 0; }
  updateParticles();
  Music.tick();
  for (const k in pressed) delete pressed[k];
}

  ctx.drawImage(SPR.skull, 158, 127);
  txt('x ' + game.lives, 170, 126);
  if (game.levelIndex === 0 && !game.checkpoint) {
    txt('Z JUMP  -  X PLUNGE', W / 2, 172, '#a8957a', 8, 'center');
    txt('STOMP IT OR PLUNGE IT.', W / 2, 188, '#a8957a', 8, 'center');
    txt('FIND THE OUTHOUSE.', W / 2, 204, '#a8957a', 8, 'center');
  } else if (lv.boss) {
    txt('HIT HIM WHILE HE IS DAZED.', W / 2, 180, '#a8957a', 8, 'center');
    txt('PLUNGE = 1 HIT   STOMP = 2', W / 2, 196, '#a8957a', 8, 'center');
  }
}
function drawGameOver() {
  darkScreen();
  txt('GAME OVER', W / 2, 70, '#d8402a', 16, 'center');
  txt('YOU ABSOLUTE PLUNGER', W / 2, 100, '#e0903a', 8, 'center');
  txt('SCORE ' + pad(game.score, 6), W / 2, 136, '#f3e2bc', 8, 'center');
  txt('HI    ' + pad(game.hi, 6), W / 2, 152, '#f3e2bc', 8, 'center');
  if (game.stateT > 60 && (game.t >> 5) % 2 === 0) txt('PRESS START', W / 2, 196, '#fff0c0', 8, 'center');
}
function drawWin() {
  darkScreen();
  txt('YOU DID IT!', W / 2, 24, '#ffd84a', 16, 'center');
  txt('MR. SHITTY HAS BEEN FLUSHED.', W / 2, 54, '#d8b0ff', 8, 'center');
  txt('THANK YOU, MARIO!', W / 2, 74, '#f3e2bc', 8, 'center');
  txt('BUT THE PRINCESS IS IN', W / 2, 90, '#e0903a', 8, 'center');
  txt('ANOTHER SEWER.', W / 2, 104, '#e0903a', 8, 'center');
  drawThrone(144, 126);
  drawMario(156, 124, 'stand', 1, game.powered, -1.1 + Math.sin(game.t * .1) * .3, 11, false);
  txt('SCORE ' + pad(game.score, 6), W / 2, 180, '#f3e2bc', 8, 'center');
  txt('HI    ' + pad(game.hi, 6), W / 2, 194, '#f3e2bc', 8, 'center');
  if (game.stateT > 60 && (game.t >> 5) % 2 === 0) txt('PRESS START', W / 2, 218, '#fff0c0', 8, 'center');
}
function render() {
  const s = game.state;
  if (s === 'intro') { drawIntro(); grade(); return; }
  if (s === 'gameover') { drawGameOver(); grade(); return; }
  if (s === 'win') { drawWin(); grade(); return; }
  const cx = Math.round(cam.x + (cam.shake ? (Math.random() - .5) * cam.shake : 0));
  drawWorld(cx);
  grade();
  if (s === 'title') { drawTitle(); return; }
  if (s === 'select') { drawSelect(); return; }
  drawHUD();
  const B = L.boss;
  if (B && B.locked && B.state !== 'gone') {
    drawBossBar(B);
    if (B.state === 'roar') {
      banner('MR. SHITTY', 64);
      txt('LORD OF THE MUCK', W / 2, 100, '#d8b0ff', 8, 'center');
    }
  }
  if (s === 'paused') { ctx.fillStyle = 'rgba(20,10,4,.45)'; ctx.fillRect(0, 15, W, H); banner('PAUSED'); }
  if (s === 'dying' && game.stateT > 50) banner(game.msg);
  if (s === 'clear' && game.stateT > 40) banner('LEVEL CLEAR!', 70);
  if (muted) txt('MUTE', W - 4, H - 12, '#e0c080', 8, 'right');
}

// ---------------------------------------------------------------- loop
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
requestAnimationFrame(frame);
</script>
</body>
